# ===================================================================
# CONFIGURACIÓN JVM OPTIMIZADA PARA MORAPACK
# ===================================================================
# Usar estos argumentos al ejecutar el servidor para mejor rendimiento
# en simulaciones semanales con grandes volúmenes de datos.
#
# USO:
#   java -jar morapack.jar @jvm-optimized.conf
# 
# O añadir manualmente al comando de ejecución:
#   java [opciones] -jar morapack.jar
# ===================================================================

# Memoria Heap (ajustar según RAM disponible)
# Para servidor con 8GB RAM:
-Xms2g
-Xmx4g

# Para servidor con 16GB+ RAM, usar:
# -Xms4g
# -Xmx8g

# Garbage Collector G1 (recomendado para aplicaciones con heap grande)
-XX:+UseG1GC
-XX:MaxGCPauseMillis=200
-XX:G1HeapRegionSize=16m
-XX:+ParallelRefProcEnabled

# Optimizaciones de compilación JIT
-XX:+TieredCompilation
-XX:CompileThreshold=1500

# Optimización de Strings (reduce uso de memoria)
-XX:+UseStringDeduplication

# Metaspace (para aplicaciones Spring Boot)
-XX:MetaspaceSize=128m
-XX:MaxMetaspaceSize=256m

# Logs de GC (opcional - descomentar para debugging)
# -Xlog:gc*:file=gc.log:time,uptime,level,tags

# Thread stack size (reducir si hay muchos threads)
-Xss512k

# Optimización para procesamiento paralelo
-XX:ParallelGCThreads=4

# Desactivar verificación de bytecode (más rápido startup)
-Xverify:none
-XX:TieredStopAtLevel=1

